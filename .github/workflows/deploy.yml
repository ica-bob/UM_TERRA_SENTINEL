#
#  Follows the official GitHub "Creating a GitHub Pages site with Jekyll"
#  starter-workflow pattern:
#    build job  → jekyll/builder Docker image → uploads Pages artifact
#    deploy job → actions/deploy-pages         → publishes to Pages
#
#  Public URL: https://ica-bob.github.io/UM_TERRA_SENTINEL/
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy UM_Terra Sentinel — Jekyll → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:           # manual trigger from the Actions tab

# Minimum permissions for Pages deployment
permissions:
  contents: read
  pages:    write
  id-token: write

# One deployment at a time; cancel superseded runs
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ── Job 1: Build the site with Jekyll ───────────────────────────────────────
  build:
    name: Jekyll Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Ruby + Bundler using the versions declared in .ruby-version / Gemfile
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"       # latest Ruby supported by github-pages gem
          bundler-cache: true        # runs `bundle install` and caches the gems

      # Configure GitHub Pages (injects site.github metadata and sets correct baseurl)
      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # Jekyll build — output goes to ./_site
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Upload the built _site/ directory as the Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        # default artifact path is ./_site — matches Jekyll's output dir

  # ── Job 2: Deploy the artifact to GitHub Pages ──────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build                   # only runs when build job succeeds

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
